<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thus Minibot · Pair Device</title>
<link rel="icon" href="https://files.catbox.moe/n2ol5k.jpg" type="image/jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
  :root{
    --bg:#07070b;
    --gold:#d4af37;
    --gold-bright:#f2cf5b;
    --ink:#eae6da;
    --ink-dim:#9a9686;
    --panel:rgba(10,10,14,0.72);
    --line:rgba(212,175,55,0.35);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    font-family:'Space Grotesk', sans-serif;
    background:#07070b;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
  }

  /* dim backdrop image, kept subtle so it never fights the panel */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:url('https://files.catbox.moe/n2ol5k.jpg') center/cover no-repeat;
    filter:brightness(0.35) saturate(0.9);
    z-index:0;
  }

  canvas#matrix{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    opacity:0.5;
  }

  .vignette{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 35%, #07070b 92%);
  }

  .container{
    position:relative;
    z-index:2;
    width:100%;
    padding:24px;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .box{
    width:420px;
    max-width:100%;
    padding:46px 34px 38px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 0 0 1px rgba(212,175,55,0.06), 0 30px 80px -20px rgba(0,0,0,0.8), 0 0 60px -10px rgba(212,175,55,0.15);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    text-align:center;
    animation:rise 0.7s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-bright);
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:22px;
  }

  .eyebrow .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#4ade80;
    box-shadow:0 0 8px #4ade80;
    animation:blink 2s ease-in-out infinite;
  }

  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  /* signature element: a linking / pairing ring around the glyph */
  .ring{
    position:relative;
    width:96px;
    height:96px;
    margin:0 auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ring::before,
  .ring::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid var(--line);
  }

  .ring::before{
    animation:spin 10s linear infinite;
    border-top-color:var(--gold-bright);
    border-right-color:var(--gold-bright);
  }

  .ring::after{
    inset:12px;
    border-style:dashed;
    animation:spin 14s linear infinite reverse;
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .ring i{
    font-size:2.1rem;
    color:var(--gold-bright);
    text-shadow:0 0 22px rgba(242,207,91,0.6);
  }

  h1{
    font-size:1.9rem;
    font-weight:700;
    letter-spacing:0.01em;
    line-height:1.15;
    background:linear-gradient(90deg,#fff, var(--gold-bright), #fff);
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:sheen 6s linear infinite;
  }

  @keyframes sheen{
    to{ background-position:200% center; }
  }

  p.sub{
    margin:12px 0 28px;
    font-size:0.95rem;
    color:var(--ink-dim);
    line-height:1.5;
  }

  .btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 38px;
    background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    border-radius:12px;
    color:#0a0a0a;
    font-weight:600;
    font-size:1rem;
    text-decoration:none;
    box-shadow:0 8px 24px -6px rgba(212,175,55,0.55);
    transition:transform 0.25s ease, box-shadow 0.25s ease;
  }

  .btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 32px -8px rgba(212,175,55,0.7);
  }

  .btn:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:4px;
  }

  .btn i{ font-size:0.95rem; }

  .meta{
    margin-top:26px;
    padding-top:20px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:center;
    gap:18px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.04em;
    color:var(--ink-dim);
  }

  .meta span i{ color:var(--gold-bright); margin-right:5px; }

  @media (max-width:480px){
    .box{ padding:38px 22px 30px; border-radius:14px; }
    h1{ font-size:1.6rem; }
    .meta{ flex-direction:column; gap:8px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="vignette"></div>

<div class="container">
  <div class="box">
    <div class="eyebrow"><span class="dot"></span> Ready to connect</div>

    <div class="ring"><i class="fa fa-robot"></i></div>

    <h1>THUS MINIBOT</h1>
    <p class="sub">Link your WhatsApp number to bring your bot online in seconds.</p>

    <a href="/pair" class="btn"><i class="fa fa-link"></i> Pair device</a>

    <div class="meta">
      <span><i class="fa-solid fa-shield-halved"></i>Secure link</span>
      <span><i class="fa-solid fa-bolt"></i>Instant setup</span>
    </div>
  </div>
</div>

<script>
  // Matrix rain background
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");
  let width, height, columns, drops;

  function resize(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    const fontSize = 16;
    columns = Math.floor(width / fontSize);
    drops = Array(columns).fill(1);
  }
  resize();
  window.addEventListener('resize', resize);

  const glyphs = "01THUSMINIBOT";
  const fontSize = 16;

  function draw(){
    ctx.fillStyle = "rgba(7,7,11,0.12)";
    ctx.fillRect(0, 0, width, height);
    ctx.font = fontSize + "px 'JetBrains Mono', monospace";

    for (let i = 0; i < drops.length; i++){
      const text = glyphs.charAt(Math.floor(Math.random() * glyphs.length));
      const y = drops[i] * fontSize;
      ctx.fillStyle = Math.random() > 0.97 ? "#fff8dc" : "rgba(212,175,55,0.75)";
      ctx.fillText(text, i * fontSize, y);
      if (y > height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  setInterval(draw, 40);
</script>
</body>
</html>
