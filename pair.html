<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diana Bot · Pair Device</title>
<link rel="icon" href="https://files.catbox.moe/im3mlc.jpg" type="image/jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
  :root{
    --bg-a:#061412;
    --bg-b:#0a1f1a;
    --signal:#3ddc97;
    --signal-soft:#8ff0c8;
    --ink:#eafff3;
    --ink-dim:#7fa695;
    --line:rgba(61,220,151,0.28);
    --panel:rgba(6,18,15,0.7);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    font-family:'Outfit', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(61,220,151,0.10), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(61,220,151,0.08), transparent 55%),
      linear-gradient(160deg, var(--bg-a), var(--bg-b));
  }

  canvas#signal{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:0.55;
  }

  .container{
    position:relative;
    z-index:2;
    width:100%;
    padding:24px;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .box{
    width:430px;
    max-width:100%;
    padding:44px 34px 36px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 30px 90px -25px rgba(0,0,0,0.85), 0 0 60px -15px rgba(61,220,151,0.18);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    text-align:center;
    animation:rise 0.75s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(20px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* signature element: two nodes handshaking with a traveling pulse */
  .handshake{
    position:relative;
    width:220px;
    height:64px;
    margin:0 auto 20px;
  }

  .node{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:56px;
    height:56px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(61,220,151,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.3rem;
    color:var(--signal-soft);
  }

  .node.left{ left:0; }
  .node.right{ right:0; }

  .track{
    position:absolute;
    top:50%;
    left:56px;
    right:56px;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
  }

  .pulse{
    position:absolute;
    top:50%;
    left:56px;
    width:8px;
    height:8px;
    margin-top:-4px;
    border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 12px var(--signal), 0 0 22px var(--signal);
    animation:travel 2.6s ease-in-out infinite;
  }

  @keyframes travel{
    0%{ left:56px; opacity:0; }
    10%{ opacity:1; }
    50%{ left:calc(100% - 64px); }
    90%{ opacity:1; }
    100%{ left:calc(100% - 64px); opacity:0; }
  }

  h1{
    font-size:1.8rem;
    font-weight:800;
    letter-spacing:0.01em;
    color:var(--ink);
  }

  h1 span{ color:var(--signal-soft); }

  p.sub{
    margin:10px 0 26px;
    font-size:0.94rem;
    color:var(--ink-dim);
    line-height:1.5;
  }

  .field-label{
    display:block;
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--signal-soft);
    margin-bottom:8px;
  }

  .input-container{
    display:flex;
    gap:0.6rem;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:14px;
    padding:0.45rem;
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .input-container:focus-within{
    border-color:var(--signal);
    box-shadow:0 0 0 3px rgba(61,220,151,0.15);
  }

  input{
    flex:1;
    padding:0.8rem 0.9rem;
    border-radius:10px;
    border:none;
    background:transparent;
    font-family:'IBM Plex Mono', monospace;
    font-size:1rem;
    color:var(--ink);
    outline:none;
  }

  input::placeholder{ color:var(--ink-dim); }

  /* hide number input spinners for a cleaner look */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }

  button{
    background:linear-gradient(135deg, var(--signal-soft), var(--signal));
    border:none;
    border-radius:10px;
    color:#04160f;
    padding:0.8rem 1.4rem;
    font-family:'Outfit', sans-serif;
    font-weight:700;
    font-size:0.92rem;
    cursor:pointer;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
    white-space:nowrap;
  }

  button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 26px -8px rgba(61,220,151,0.6);
  }

  button:focus-visible{
    outline:2px solid var(--signal-soft);
    outline-offset:3px;
  }

  #waiting-message{
    margin-top:20px;
    color:var(--signal-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    font-weight:500;
    display:none;
    align-items:center;
    justify-content:center;
    gap:10px;
  }

  .loader{
    border:2px solid rgba(61,220,151,0.2);
    border-top:2px solid var(--signal);
    border-radius:50%;
    width:16px;
    height:16px;
    animation:spin 0.9s linear infinite;
    display:inline-block;
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  #pair{
    margin-top:20px;
    font-family:'IBM Plex Mono', monospace;
    font-size:1.05rem;
    word-break:break-all;
  }

  #copy-btn{
    display:none;
    margin-top:18px;
    background:linear-gradient(135deg, var(--signal-soft), var(--signal));
    border:none;
    padding:12px 26px;
    border-radius:12px;
    color:#04160f;
    font-family:'Outfit', sans-serif;
    font-weight:700;
    cursor:pointer;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }

  #copy-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 26px -8px rgba(61,220,151,0.6);
  }

  @media (max-width:480px){
    .box{ padding:34px 22px 28px; border-radius:16px; }
    h1{ font-size:1.5rem; }
    .input-container{ flex-direction:column; }
    button{ width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

<canvas id="signal"></canvas>

<div class="container">
  <div class="box">

    <div class="handshake">
      <div class="node left"><i class="fa-brands fa-whatsapp"></i></div>
      <div class="track"></div>
      <div class="pulse"></div>
      <div class="node right"><i class="fa fa-robot"></i></div>
    </div>

    <h1>DIANA <span>FREE BOT</span></h1>
    <p class="sub">Enter your WhatsApp number to generate a pairing code.</p>

    <label class="field-label" for="number">WhatsApp number</label>
    <div class="input-container">
      <input placeholder="1809xxxxxxxxx" type="number" id="number">
      <button id="submit">Pair</button>
    </div>

    <div id="waiting-message"><span class="loader"></span>Generating your code…</div>
    <div id="pair"></div>
    <button id="copy-btn">Copy code</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.2/axios.min.js"></script>
<script>
  // Ambient connection-signal background (replaces the matrix rain with a calmer network of drifting nodes)
  const canvas = document.getElementById("signal");
  const ctx = canvas.getContext("2d");
  let width, height, dots;

  function resize(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    const count = Math.floor((width * height) / 22000);
    dots = Array.from({ length: count }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      r: Math.random() * 1.6 + 0.6
    }));
  }
  resize();
  window.addEventListener('resize', resize);

  function step(){
    ctx.clearRect(0, 0, width, height);

    for (const d of dots){
      d.x += d.vx;
      d.y += d.vy;
      if (d.x < 0 || d.x > width) d.vx *= -1;
      if (d.y < 0 || d.y > height) d.vy *= -1;
    }

    for (let i = 0; i < dots.length; i++){
      for (let j = i + 1; j < dots.length; j++){
        const a = dots[i], b = dots[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120){
          ctx.strokeStyle = `rgba(61,220,151,${0.12 * (1 - dist / 120)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    ctx.fillStyle = "rgba(143,240,200,0.65)";
    for (const d of dots){
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(step);
  }
  step();

  // Pair logic (unchanged)
  const submitBtn = document.getElementById("submit");
  const numberInput = document.getElementById("number");
  const pairOutput = document.getElementById("pair");
  const waitingMsg = document.getElementById("waiting-message");
  const copyBtn = document.getElementById("copy-btn");

  submitBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    const number = numberInput.value.replace(/[^0-9]/g, "");
    if (!number || number.length < 11) {
      pairOutput.innerHTML = '<span style="color:#8ff0c8;">Please enter a valid number.</span>';
      return;
    }

    waitingMsg.style.display = "flex";
    pairOutput.innerHTML = "";
    copyBtn.style.display = "none";

    try {
      const { data } = await axios.get(`/code?number=${number}`);
      const code = data.code || "Unavailable";

      waitingMsg.style.display = "none";
      pairOutput.innerHTML = `<span style="font-weight:600;color:#3ddc97;">CODE:</span> <span id="copy-text" style="color:#eafff3;">${code}</span>`;
      copyBtn.style.display = "inline-block";

      copyBtn.onclick = async () => {
        await navigator.clipboard.writeText(code);
        copyBtn.innerText = "Copied ✓";
        setTimeout(() => copyBtn.innerText = "Copy code", 1500);
      };
    } catch (err) {
      waitingMsg.style.display = "none";
      pairOutput.innerHTML = `<span style="color:#8ff0c8;">❌ Failed, please try again.</span>`;
    }
  });
</script>
</body>
</html>
